[package]
name = "pine_tracker"
version = "0.2.0"
edition = "2024"
description = "M8 / LittleGPTracker-style 8-track hexadecimal music tracker and groovebox for PinePhone + KB151"

[features]
default = []
deck-dev = []

[dependencies]
alsa = "0.9"
crossbeam-channel = "0.5"
hound = "3.5"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_arch = "x86_64")'.dependencies]
sdl2 = "0.37"
